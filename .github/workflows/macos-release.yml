name: Build universal macOS release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build for Apple Silicon and Intel
        run: npm run tauri -- build --ci --target universal-apple-darwin --bundles app -- --locked
      - name: Verify architectures and preserve bundle permissions
        run: |
          lipo target/universal-apple-darwin/release/bundle/macos/Swaggy.app/Contents/MacOS/swaggy -verify_arch arm64 x86_64
          tar -czf Swaggy-macOS-universal.app.tar.gz -C target/universal-apple-darwin/release/bundle/macos Swaggy.app
      - uses: actions/upload-artifact@v4
        with:
          name: swaggy-macOS-universal
          path: Swaggy-macOS-universal.app.tar.gz
          if-no-files-found: error
