name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build installers
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Preserve macOS bundle permissions
        if: runner.os == 'macOS'
        run: tar -czf target/release/Swaggy-macOS-${{ runner.arch }}.app.tar.gz -C target/release/bundle/macos Swaggy.app
      - uses: actions/upload-artifact@v4
        with:
          name: swaggy-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/Swaggy-*.app.tar.gz
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
